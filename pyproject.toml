[project]
name = "metso-sales-assistant"
version = "0.1.0"
description = "A source-grounded assistant for product advice and service estimates"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.146.0",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
  "python-dotenv==1.2.4",
  "numpy==2.5.4",
  "pandas==3.0.6",
  "rank-bm25==0.2.2",
  "pymupdf==1.28.2",
  "pydantic==2.14.1",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers==6.1.0", "torch==2.14.1"]

[dependency-groups]
dev = ["ruff==0.17.1"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
